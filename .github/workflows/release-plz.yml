name: release-plz

on:
  push:
    branches: [main]

# Never run two release-plz passes against main at once.
concurrency:
  group: release-plz-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Opens/updates the "chore: release" PR (version bump + changelogs).
  release-pr:
    name: release-plz PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Mint GitHub App token
        # A GitHub App token (not the default GITHUB_TOKEN) is required so that
        # ci.yml / e2e.yml actually run on the release PR — the default token
        # cannot trigger workflows on the PRs it opens.
        uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_PLZ_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          token: ${{ steps.app-token.outputs.token }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: release-plz release-pr
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          # release-plz decides "did this crate change since its last release"
          # by checking the release tag out into a fresh /tmp worktree per crate
          # and running `cargo package --workspace` there, whose verify step is
          # a full build. Left alone, each of the eight worktrees builds cold
          # into its own `target/` (~3.5 min each on a runner). Pointing every
          # worktree at the checkout's `target/` -- the directory rust-cache
          # above restores and saves -- lets worktrees 2..8 reuse the first
          # one's artifacts, and lets the next run start warm.
          CARGO_TARGET_DIR: ${{ github.workspace }}/target

  # After the release PR merges: create git tags + GitHub Releases. No publish.
  release:
    name: release-plz release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Mint GitHub App token
        uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_PLZ_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          token: ${{ steps.app-token.outputs.token }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: release-plz release
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          # Same worktree-build sharing as the release-pr job above.
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
