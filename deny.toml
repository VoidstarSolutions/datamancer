# Dependency gates: licenses must stay permissive (the workspace itself is
# MIT OR Apache-2.0), advisories must be triaged, sources must be crates.io.

[graph]
all-features = true

[licenses]
# Permissive-only allowlist. Extending it with another PERMISSIVE license
# (BSD-family, ISC, Zlib, Unicode) is routine; adding any copyleft or
# source-available license (GPL/AGPL/LGPL/MPL/BUSL/SSPL) is a project
# decision - stop and raise it, do not just append.
#
# Entries below that carry a "(decision YYYY-MM-DD)" comment are
# already-decided project decisions (e.g. MPL-2.0 for option-ext), not
# routine appends - do not treat their presence as license alone.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "0BSD",                # enum-iterator, enum-iterator-derive (via iceoryx2-bb-posix)
    "CDLA-Permissive-2.0",  # webpki-root-certs (via rustls-platform-verifier -> reqwest -> oxidized_alpaca)
    "MPL-2.0",              # option-ext (via directories); file-level copyleft, unmodified use imposes nothing on this project (decision 2026-07-03)
]

[licenses.private]
# Every workspace crate declares MIT OR Apache-2.0, and the texts ship at the
# repository root (LICENSE-MIT, LICENSE-APACHE). Skip license enforcement for
# local, unpublished workspace members only - this does not affect any
# third-party dependency.
ignore = true

[advisories]
yanked = "deny"
# zbus 6.0 absorbed zvariant, zvariant_derive and zbus_names, and RustSec marks
# the standalone crates unmaintained. They reach us only through the Linux
# secret-service keyring backend (keyring -> zbus-secret-service-keyring-store
# -> secret-service 5 -> zbus 5), and no release of that chain builds on zbus 6
# yet (checked 2026-10-20: secret-service 5.2.0 still requires zbus ^5). Drop
# these once secret-service ships on zbus 6 and the lockfile moves with it.
ignore = [
    { id = "RUSTSEC-2026-0370", reason = "zvariant: unmaintained standalone; no zbus 6 path via secret-service yet" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names: unmaintained standalone; no zbus 6 path via secret-service yet" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive: unmaintained standalone; no zbus 6 path via secret-service yet" },
]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# No git sources: oxidized_alpaca is now a published crates.io dependency
# (all workspace deps must be registry-resolvable for release-plz's git_only
# `cargo package --workspace` diffing to succeed — see RELEASING.md).
allow-git = []
